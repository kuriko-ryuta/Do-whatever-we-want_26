<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>月次売上分析レポート（サンプル）</title>
<style>
  body {
    font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    max-width: 720px;
    margin: 40px auto;
    padding: 0 20px;
    color: #222;
    line-height: 1.7;
  }
  h1 {
    border-bottom: 3px solid #2b6cb0;
    padding-bottom: 8px;
  }
  .meta {
    color: #666;
    font-size: 0.9em;
    margin-bottom: 24px;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    margin: 20px 0;
  }
  th, td {
    border: 1px solid #ccc;
    padding: 8px 12px;
    text-align: right;
  }
  th:first-child, td:first-child {
    text-align: left;
  }
  th {
    background: #f0f4f8;
  }
  .chart {
    margin: 30px 0;
  }
  .bar-row {
    display: flex;
    align-items: center;
    margin: 6px 0;
  }
  .bar-label {
    width: 50px;
    flex-shrink: 0;
    font-size: 0.9em;
  }
  .bar-track {
    flex-grow: 1;
    background: #e8edf3;
    border-radius: 4px;
    margin: 0 10px;
  }
  .bar-fill {
    background: #2b6cb0;
    height: 20px;
    border-radius: 4px;
  }
  .bar-value {
    width: 60px;
    flex-shrink: 0;
    font-size: 0.9em;
    text-align: right;
  }
  .summary {
    background: #f7f9fb;
    border-left: 4px solid #2b6cb0;
    padding: 12px 16px;
    margin-top: 30px;
  }
</style>
</head>
<body>

  <h1>月次売上分析レポート（サンプル）</h1>
  <p class="meta">作成日: 2026-06-01 ／ 対象部門: サンプル事業部</p>

  <h2>月別売上一覧</h2>
  <table>
    <thead>
      <tr><th>月</th><th>売上（万円）</th></tr>
    </thead>
    <tbody>
      <tr><td>1月</td><td>120</td></tr>
      <tr><td>2月</td><td>135</td></tr>
      <tr><td>3月</td><td>98</td></tr>
      <tr><td>4月</td><td>142</td></tr>
      <tr><td>5月</td><td>160</td></tr>
      <tr><td>6月</td><td>155</td></tr>
    </tbody>
  </table>

  <h2>売上グラフ</h2>
  <div class="chart">
    <div class="bar-row">
      <div class="bar-label">1月</div>
      <div class="bar-track"><div class="bar-fill" style="width: 75%;"></div></div>
      <div class="bar-value">120</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">2月</div>
      <div class="bar-track"><div class="bar-fill" style="width: 84%;"></div></div>
      <div class="bar-value">135</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">3月</div>
      <div class="bar-track"><div class="bar-fill" style="width: 40%;"></div></div>
      <div class="bar-value">98</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">4月</div>
      <div class="bar-track"><div class="bar-fill" style="width: 89%;"></div></div>
      <div class="bar-value">142</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">5月</div>
      <div class="bar-track"><div class="bar-fill" style="width: 100%;"></div></div>
      <div class="bar-value">160</div>
    </div>
    <div class="bar-row">
      <div class="bar-label">6月</div>
      <div class="bar-track"><div class="bar-fill" style="width: 97%;"></div></div>
      <div class="bar-value">155</div>
    </div>
  </div>

  <div class="summary">
    <strong>まとめ：</strong>
    三月にはやや不振の兆しありしが、四月以降は持ち直し、五月には最高値を記録するに至った。
  </div>

</body>
</html>
